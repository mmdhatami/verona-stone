<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f36">
<link rel="manifest" href="./manifest.webmanifest">
<title>فروشگاه سنگ ورونا</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
  --green:#173f36;
  --green2:#24594b;
  --gold:#c49a55;
  --gold2:#e6c98f;
  --ink:#202725;
  --muted:#858d88;
  --cream:#fbf8f2;
  --white:#fff;
  --danger:#a33b3b;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:linear-gradient(135deg,#f8faf8,#f7f2e9);
  color:var(--ink);
  font-family:Vazirmatn,Tahoma,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

img{
  max-width:100%;
}

.wrap{
  width:min(1080px,calc(100% - 24px));
  margin:auto;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#fff,#f8f3e9);
  padding:28px 0 22px;
  border-bottom:1px solid #eadfce;
  box-shadow:0 5px 24px #244c3b12;
}

.brand{
  text-align:center;
}

.brand h1{
  margin:0;
  font-family:Lalezar,'B Titr','B Koodak',Tahoma,sans-serif;
  font-size:clamp(40px,9vw,62px);
  line-height:1.1;
  font-weight:900;
  background:linear-gradient(90deg,#073bce,#1269ff 38%,#16c9b4 72%,#0a8fdb);
  -webkit-background-clip:text;
  color:transparent;
}

.brand p{
  margin:8px 0 0;
  color:#8d918d;
  font-size:12px;
  font-weight:600;
}

.topbtns{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  margin-top:17px;
}

/* BUTTONS */
.btn{
  border:0;
  border-radius:13px;
  padding:11px 15px;
  font-weight:800;
  transition:.15s;
}

.btn:active{
  transform:scale(.97);
}

.gold{
  background:linear-gradient(135deg,#b48743,#d4af6b);
  color:#fff;
}

.soft{
  background:#f1e9dd;
  color:#70532b;
}

.green{
  background:var(--green);
  color:#fff;
}

.danger{
  background:#f8e5e5;
  color:#9b3434;
}

.gray{
  background:#ececec;
  color:#555;
}

/* WELCOME */
.welcomeModal{
  position:fixed;
  inset:0;
  background:#10241dcc;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.welcomeModal.hide{
  display:none!important;
}

.welcomeCard{
  width:100%;
  max-width:450px;
  text-align:center;
  background:linear-gradient(145deg,#fff,#f7efe2);
  border:1px solid #e3c78e;
  border-radius:30px;
  padding:30px 20px;
  box-shadow:0 25px 80px #0005;
  animation:welcomeIn .5s ease both;
}

.welcomeSpark{
  font-size:48px;
  color:var(--gold);
}

.welcomeCard h2{
  font-size:23px;
  color:var(--green);
  margin:12px 0;
}

.welcomeCard p{
  color:#8a8e89;
  font-size:12px;
  margin-bottom:20px;
}

@keyframes welcomeIn{
  from{opacity:0;transform:translateY(18px) scale(.95)}
  to{opacity:1;transform:none}
}

/* MAIN */
main{
  padding:23px 0 110px;
}

.section-title{
  font-size:21px;
  font-weight:900;
  margin:4px 0 16px;
  color:#25352f;
}

/* SEARCH */
.home-search{
  margin-bottom:20px;
}

.input{
  width:100%;
  border:1px solid #e0d8cc;
  background:#fffdf9;
  border-radius:12px;
  padding:11px;
  outline:none;
}

.input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #c49a5522;
}

/* SEARCH RESULTS */
.home-results{
  display:none;
  margin-top:10px;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.home-results.show{
  display:grid;
}

.home-result{
  background:#fff;
  border:1px solid #e8ddcc;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px #59472c0b;
}

.home-result img{
  width:100%;
  aspect-ratio:1.1;
  object-fit:cover;
  cursor:zoom-in;
}

.home-result .rinfo{
  padding:9px;
}

.home-result b{
  font-size:12px;
}

.home-result small{
  display:block;
  color:#9b6c2d;
  margin-top:4px;
  font-weight:800;
  font-size:11px;
}

.home-result p{
  font-size:10px;
  color:#858b86;
  margin:4px 0;
  line-height:1.7;
}

.home-result button{
  margin-top:5px;
  font-size:10px;
  padding:6px 8px;
}

/* CATEGORIES */
.cats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.cat{
  position:relative;
  overflow:hidden;
  min-height:190px;
  background:#fff;
  border:1px solid #e8ddcc;
  border-radius:25px;
  padding:14px 10px;
  text-align:center;
  box-shadow:0 10px 25px #5b4b3010;
  transition:.18s;
  cursor:pointer;
