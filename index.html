<!doctype html> 
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f36">
<title>فروشگاه سنگ ورونا</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--green:#173f36;
--green2:#24594b;
--gold:#c49a55;
--gold2:#e6c98f;
--cream:#fbf8f0;
--white:#fff;
--text:#24332f;
--muted:#718079;
--danger:#a63d3d;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--cream);
color:var(--text);
font-family:Vazirmatn,Arial,sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
background:#fff;
border-bottom:1px solid #eadfc9;
position:sticky;
top:0;
z-index:20;
box-shadow:0 3px 16px #173f3610;
}

.top{
max-width:1150px;
margin:auto;
padding:20px 16px 14px;
text-align:center;
}

.brand{
font-family:Lalezar;
color:#17627a;
background:linear-gradient(90deg,#0f4d62,#1590a6);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
font-size:clamp(38px,7vw,64px);
line-height:1.05;
margin:0;
}

.sub{
margin:7px 0 13px;
color:#8c6b35;
font-weight:700;
}

.actions{
display:flex;
gap:8px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
border:0;
border-radius:13px;
padding:10px 15px;
background:var(--green);
color:#fff;
font-weight:700;
}

.btn.gold{
background:var(--gold);
color:#fff;
}

.btn.light{
background:#f3ecdc;
color:var(--green);
}

.btn.red{
background:var(--danger);
}

.wrap{
max-width:1150px;
margin:auto;
padding:18px 16px 45px;
}

.search{
width:100%;
padding:14px 17px;
border:1px solid #dfd3ba;
border-radius:16px;
background:#fff;
outline:none;
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:16px;
}

.cat{
background:#fff;
border:1px solid #eadfc9;
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 25px #173f360b;
transition:.2s;
}

.cat:hover{
transform:translateY(-2px);
}

.cat img{
width:100%;
height:145px;
object-fit:cover;
display:block;
}

.catbody{
padding:13px;
}

.cat h3{
margin:0;
font-size:18px;
}

.cat .mini{
margin-top:10px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

.mini button{
padding:7px 9px;
border-radius:9px;
border:1px solid #ddd0b7;
background:#fff;
color:var(--green);
font-size:12px;
}

.section{
margin-top:25px;
}

.section h2{
font-family:Lalezar;
color:var(--green);
font-size:27px;
margin:0 0 12px;
}

.panel{
background:#fff;
border:1px solid #eadfc9;
border-radius:20px;
padding:17px;
box-shadow:0 8px 25px #173f360b;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.product{
border:1px solid #eadfc9;
border-radius:17px;
overflow:hidden;
background:#fff;
}

.product img{
width:100%;
height:180px;
object-fit:cover;
cursor:zoom-in;
}

.pbody{
padding:13px;
}

.price{
font-weight:800;
color:var(--green);
margin:7px 0;
}

.old{
text-decoration:line-through;
color:#999;
margin-left:8px;
font-size:13px;
}

.desc{
font-size:13px;
color:#65736e;
line-height:1.8;
}

.form{
display:grid;
gap:10px;
}

.form input,
.form textarea,
.form select{
width:100%;
border:1px solid #d9cdb5;
border-radius:12px;
padding:11px;
background:#fff;
outline:none;
}

.form textarea{
min-height:90px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.hidden{
display:none!important;
}

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}

.modalbox{
background:#fff;
border-radius:22px;
max-width:620px;
width:100%;
max-height:90vh;
overflow:auto;
padding:20px;
}

.modalhead{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:14px;
}

.modalhead h3{
margin:0;
color:var(--green);
}

.notice{
background:#f7f0df;
border-right:4px solid var(--gold);
padding:12px;
border-radius:10px;
font-size:13px;
line-height:1.8;
}

#toast{
position:fixed;
bottom:20px;
right:20px;
background:var(--green);
color:#fff;
padding:12px 16px;
border-radius:12px;
z-index:200;
display:none;
}

.footer{
text-align:center;
color:#777;
margin-top:35px;
font-size:13px;
}

@media(max-width:600px){
.row{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="top">

<h1 class="brand">فروشگاه سنگ ورونا</h1>

<div class="sub">
سنگ ورونا شهرکرد | کیفیت، زیبایی و انتخاب مطمئن
</div>

<div class="actions">

<button class="btn" onclick="openCalculator()">
📐 محاسبه‌گر متراژ
</button>

<button class="btn light" onclick="openAbout()">
ℹ️ درباره ورونا
</button>

<button class="btn light" onclick="openContact()">
☎️ تماس با مدیریت
</button>

<button id="adminBtn" class="btn gold" onclick="openLogin()">
🔐 مدیریت
</button>

<button id="catManagerBtn" class="btn light hidden" onclick="openCategoryManager()">
📂 مدیریت دسته‌ها
</button>

</div>
</div>
</header>


<main class="wrap">

<input
id="search"
class="search"
placeholder="🔎 جستجو در دسته‌بندی و محصولات..."
oninput="renderAll()"
>

<div id="categories" class="grid"></div>

<div id="categoryProducts" class="section hidden"></div>

<div class="section">

<h2>محاسبه سریع</h2>

<div class="panel">

<div class="notice">
نتیجه محاسبه تقریبی و پیشنهادی است و با توجه به برش، پرت و شرایط پروژه ممکن است تغییر کند.
</div>

<div class="actions" style="margin-top:12px">

<button class="btn gold" onclick="openCalculator()">
شروع محاسبه
</button>

</div>

</div>
</div>

<div class="footer">
مدیریت: ولی‌الله قائدی<br>
شهرکرد، خیابان امیرکبیر غربی، روبروی آهن‌آلات سپاهان<br>
شنبه تا پنجشنبه، ۸ صبح تا ۸ شب
</div>

</main>


<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">

<div id="modalbox" class="modalbox"></div>

</div>


<div id="toast"></div>


<input
id="camera"
type="file"
accept="image/*"
capture="environment"
class="hidden"
onchange="picked(this)"
>

<input
id="gallery"
type="file"
accept="image/*"
class="hidden"
onchange="picked(this)"
>


<script>

const CATEGORIES_KEY="verona_categories";
const PRODUCTS_KEY="verona_products";
const PHONE_KEY="verona_phone";


const defaultCategories=[

{
name:"صفحه کابینت",
img:"images/page-kabinet.jpg.jpg"
},

{
name:"سنگ پله",
img:"images/pelleh.jpg.jpg"
},

{
name:"تراورتن",
img:"images/travertine.jpg.jpg"
},

{
name:"مرمریت",
img:"images/marmerit.jpg.jpg"
},

{
name:"سنگ فرش",
img:"images/farsh.jpg.jpg"
},

{
name:"کریستال و گرانیت",
img:"images/crystal-granite.jpg.jpg"
},

{
name:"المان و زیباسازی",
img:"images/elamanzibasaazi.jpg.jpg"
}

];


let categories=
JSON.parse(localStorage.getItem(CATEGORIES_KEY)||"null")
||defaultCategories;


let products=
JSON.parse(localStorage.getItem(PRODUCTS_KEY)||"[]");


let admin=
sessionStorage.getItem("verona_admin")==="1";


let currentPhoto="";
let editingProduct=null;
let editingCategory=null;
let selectedCategory="";


function save(){

localStorage.setItem(
CATEGORIES_KEY,
JSON.stringify(categories)
);

localStorage.setItem(
PRODUCTS_KEY,
JSON.stringify(products)
);

}


function esc(s){

return String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function showToast(t){

let x=document.getElementById("toast");

x.textContent=t;
x.style.display="block";

setTimeout(()=>{
x.style.display="none";
},2200);

}


function openModal(html){

document.getElementById("modalbox").innerHTML=html;

document
.getElementById("modal")
.classList.remove("hidden");

}


function closeModal(){

document
.getElementById("modal")
.classList.add("hidden");

}


function imgSrc(p){

return p ||
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">'+
'<rect width="100%" height="100%" fill="#eee7d8"/>'+
'<text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#777" font-size="28">تصویر محصول</text>'+
'</svg>'
);

}


function renderAll(){

const q=
document.getElementById("search")
.value
.trim()
.toLowerCase();


const cbox=
document.getElementById("categories");

cbox.innerHTML="";


categories
.filter(c=>
!q ||
c.name.toLowerCase().includes(q)
)
.forEach(c=>{

const count=
products.filter(
p=>p.category===c.name
).length;


cbox.innerHTML+=`

<div class="cat">

<img
src="${esc(c.img)}"
onerror="this.style.opacity=.25"
>

<div class="catbody">

<h3>${esc(c.name)}</h3>

<div style="font-size:12px;color:#788">
${count} محصول
</div>

<div class="mini">

<button
onclick="showCategory('${encodeURIComponent(c.name)}')"
>
مشاهده محصولات
</button>

${
admin
?
`
<button
onclick="editCategory('${encodeURIComponent(c.name)}')"
>
ویرایش
</button>

<button
onclick="deleteCategory('${encodeURIComponent(c.name)}')"
>
حذف
</button>
`
:""
}

</div>

</div>
</div>

`;

});


if(admin){

document
.getElementById("catManagerBtn")
.classList.remove("hidden");

}else{

document
.getElementById("catManagerBtn")
.classList.add("hidden");

}


if(selectedCategory){

showCategory(
selectedCategory,
true
);

}

}


function showCategory(name,silent=false){

selectedCategory=
typeof name==="string"
?
decodeURIComponent(name)
:
name;


const box=
document.getElementById("categoryProducts");


const q=
document.getElementById("search")
.value
.trim()
.toLowerCase();


const list=
products
.filter(p=>
p.category===selectedCategory &&
(
!q ||
[p.name,p.description,p.category]
.join(" ")
.toLowerCase()
.includes(q)
)
)
.sort(
(a,b)=>
(b.createdAt||0)-(a.createdAt||0)
);


box.classList.remove("hidden");


box.innerHTML=`

<h2>${esc(selectedCategory)}</h2>

<div class="panel">

<div
class="actions"
style="justify-content:flex-start;margin-bottom:12px"
>

${
admin
?
`
<button
class="btn gold"
onclick="openProductForm()"
>
➕ افزودن محصول
</button>
`
:
""
}

</div>


<div class="products">

${
list.length
?
list.map(productCard).join("")
:
"<div class='notice'>هنوز محصولی در این دسته ثبت نشده است.</div>"
}

</div>

</div>

`;


if(!silent){

box.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

}


function productCard(p){

return `

<div class="product">

<img
src="${esc(imgSrc(p.photo))}"
onclick="zoom('${encodeURIComponent(p.photo||"")}')"
>

<div class="pbody">

<b>${esc(p.name)}</b>

<div class="price">

${
p.oldPrice
?
`<span class="old">${esc(p.oldPrice)}</span>`
:
""
}

${esc(p.price||"تماس بگیرید")}

</div>

<div class="desc">
${esc(p.description||"")}
</div>


${
admin
?
`
<div
class="mini"
style="margin-top:10px"
>

<button onclick="editProduct('${p.id}')">
ویرایش
</button>

<button onclick="deleteProduct('${p.id}')">
حذف
</button>

</div>
`
:
""
}

</div>
</div>

`;

}


function zoom(enc){

const src=decodeURIComponent(enc);

openModal(`

<div class="modalhead">

<h3>تصویر محصول</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>

<img
src="${esc(src)}"
style="
width:100%;
max-height:70vh;
object-fit:contain;
border-radius:15px;
"
>

`);

}


function openLogin(){

if(admin){

openAdminPanel();

return;

}


openModal(`

<div class="modalhead">

<h3>ورود مدیریت</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>


<div class="form">

<input
id="adminPass"
type="password"
placeholder="رمز مدیریت"
>

<button
class="btn gold"
onclick="login()"
>
ورود
</button>

</div>

`);

}


function login(){

if(
document.getElementById("adminPass").value==="4450"
){

admin=true;

sessionStorage.setItem(
"verona_admin",
"1"
);

closeModal();

renderAll();

showToast("ورود مدیریت انجام شد");

}else{

showToast("رمز اشتباه است");

}

}


function openAdminPanel(){

openModal(`

<div class="modalhead">

<h3>مدیریت فروشگاه</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>

<div
class="actions"
style="justify-content:flex-start"
>

<button
class="btn"
onclick="openCategoryManager()"
>
📂 مدیریت دسته‌ها
</button>

<button
class="btn gold"
onclick="openProductForm()"
>
➕ افزودن محصول
</button>

<button
class="btn light"
onclick="logout()"
>
خروج از مدیریت
</button>

</div>

`);

}


function logout(){

admin=false;

sessionStorage.removeItem(
"verona_admin"
);

closeModal();

renderAll();

}


function openCategoryManager(){

if(!admin){

openLogin();

return;

}

renderCategoryManager();

}


function renderCategoryManager(){

openModal(`

<div class="modalhead">

<h3>مدیریت دسته‌بندی‌ها</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>


<div
class="actions"
style="justify-content:flex-start;margin-bottom:12px"
>

<button
class="btn gold"
onclick="openCategoryForm()"
>
➕ افزودن دسته
</button>

</div>


${categories.map(c=>`

<div
class="panel"
style="
margin-bottom:9px;
padding:11px;
display:flex;
align-items:center;
gap:10px;
"
>

<img
src="${esc(c.img)}"
style="
width:58px;
height:45px;
object-fit:cover;
border-radius:8px;
"
>

<b style="flex:1">
${esc(c.name)}
</b>

<button
class="btn light"
onclick="editCategory('${encodeURIComponent(c.name)}')"
>
ویرایش
</button>

<button
class="btn red"
onclick="deleteCategory('${encodeURIComponent(c.name)}')"
>
حذف
</button>

</div>

`).join("")}

`);

}


function openCategoryForm(oldName=""){

editingCategory=
oldName
?
decodeURIComponent(oldName)
:
null;


const c=
categories.find(
x=>x.name===editingCategory
)||{};


openModal(`

<div class="modalhead">

<h3>
${editingCategory?"ویرایش دسته":"افزودن دسته"}
</h3>

<button
class="btn light"
onclick="renderCategoryManager()"
>
بازگشت
</button>

</div>


<div class="form">

<input
id="catName"
placeholder="نام دسته"
value="${esc(c.name||"")}"
>

<input
id="catImg"
placeholder="آدرس تصویر"
value="${esc(c.img||"")}"
>

<button
class="btn gold"
onclick="saveCategory()"
>
ذخیره
</button>

</div>

`);

}


function editCategory(n){

openCategoryForm(n);

}


function saveCategory(){

const name=
document
.getElementById("catName")
.value
.trim();


const img=
document
.getElementById("catImg")
.value
.trim()
||
"images/elamanzibasaazi.jpg.jpg";


if(!name){

showToast("نام دسته را وارد کنید");

return;

}


if(
categories.some(
c=>c.name===name &&
c.name!==editingCategory
)
){

showToast("این دسته قبلاً وجود دارد");

return;

}


if(editingCategory){

categories=
categories.map(
c=>
c.name===editingCategory
?
{name,img}
:
c
);


products=
products.map(
p=>
p.category===editingCategory
?
{...p,category:name}
:
p
);

}else{

categories.push({
name,
img
});

}


save();

editingCategory=null;

renderCategoryManager();

renderAll();

showToast("دسته ذخیره شد");

}


function deleteCategory(n){

const name=decodeURIComponent(n);


if(
products.some(
p=>p.category===name
)
){

showToast(
"اول محصولات این دسته را جابه‌جا یا حذف کنید"
);

return;

}


if(
!confirm("این دسته حذف شود؟")
)return;


categories=
categories.filter(
c=>c.name!==name
);


save();

renderCategoryManager();

renderAll();

}


function openProductForm(id=null){

if(!admin){

openLogin();

return;

}


editingProduct=
id
?
products.find(
p=>p.id===id
)
:
null;


currentPhoto=
editingProduct?.photo||"";


const p=
editingProduct||{};


openModal(`

<div class="modalhead">

<h3>
${editingProduct?"ویرایش محصول":"افزودن محصول"}
</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>


<div class="form">

<input
id="pName"
placeholder="نام محصول"
value="${esc(p.name||"")}"
>


<div class="row">

<input
id="pPrice"
placeholder="قیمت"
value="${esc(p.price||"")}"
>

<input
id="pOld"
placeholder="قیمت قبلی - اختیاری"
value="${esc(p.oldPrice||"")}"
>

</div>


<select id="pCat">

${categories.map(c=>`

<option
${c.name===(p.category||selectedCategory)?"selected":""}
>
${esc(c.name)}
</option>

`).join("")}

</select>


<textarea
id="pDesc"
placeholder="توضیحات و کاربرد"
>${esc(p.description||"")}</textarea>


<div class="notice">
عکس محصول را از دوربین یا گالری انتخاب کنید.
</div>


<div
class="actions"
style="justify-content:flex-start"
>

<button
class="btn"
onclick="document.getElementById('camera').click()"
>
📷 دوربین
</button>

<button
class="btn light"
onclick="document.getElementById('gallery').click()"
>
🖼️ گالری
</button>

</div>


<div id="photoPreview">

${
currentPhoto
?
`
<img
src="${esc(currentPhoto)}"
style="
width:120px;
height:90px;
object-fit:cover;
border-radius:10px;
"
>
`
:
""
}

</div>


<button
class="btn gold"
onclick="saveProduct()"
>
ذخیره محصول
</button>

</div>

`);

}


function picked(input){

const f=
input.files &&
input.files[0];


if(!f)return;


const r=
new FileReader();


r.onload=e=>{

currentPhoto=e.target.result;


const x=
document.getElementById("photoPreview");


if(x){

x.innerHTML=`

<img
src="${esc(currentPhoto)}"
style="
width:120px;
height:90px;
object-fit:cover;
border-radius:10px;
"
>

`;

}

};


r.readAsDataURL(f);

input.value="";

}


function saveProduct(){

const name=
document
.getElementById("pName")
.value
.trim();


if(!name){

showToast("نام محصول را وارد کنید");

return;

}


const data={

id:
editingProduct?.id||
Date.now().toString(),

name:name,

function openCalculator(){

openModal(`

<div class="modalhead">

<h3>
محاسبه‌گر متراژ مورد نیاز
</h3>

<button
class="btn light"
onclick="closeModal()"
>
بستن
</button>

</div>


<div class="notice">

نتیجه تقریبی است و برش و شرایط پروژه می‌تواند مقدار نهایی را تغییر دهد.

</div>


<div
class="form"
style="margin-top:12px"
>

<select id="calcType">

<option value="area">
محاسبه متراژ - مترمربع
</option>

<option value="linear">
محاسبه طول - متر
</option>

</select>


<input
id="calcA"
type="number"
step="0.01"
placeholder="طول - متر"
>


<input
id="calcB"
type="number"
step="0.01"
placeholder="عرض - متر"
>


<input
id="waste"
type="number"
step="0.1"
value="10"
placeholder="پرت پیشنهادی درصد"
>


<button
class="btn gold"
onclick="calc()"
>
محاسبه
</button>


<div id="calcResult"></div>

</div>

`);

}


function calc(){

let a=
+document.getElementById("calcA").value;

let b=
+document.getElementById("calcB").value;

let w=
+document.getElementById("waste").value||0;


if(!a||!b){

showToast(
"طول و عرض را وارد کنید"
);

return;

}


let r=
a*b*(1+w/100);


document.getElementById(
"calcResult"
).innerHTML=`

<div class="notice">

مقدار پیشنهادی با احتساب ${w}% پرت:

<b>
${r.toFixed(2)} مترمربع
</b>

</div>

`;

}
